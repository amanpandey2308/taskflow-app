<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — TaskFlow</title>
  <meta name="description" content="Your project and task overview"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">⚡ Task<span>Flow</span></div>
    <div class="navbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">U</div>
        <span class="user-name" id="user-name">User</span>
      </div>
      <button class="btn-ghost btn-sm" id="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="container page-wrapper">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem">
      <div>
        <h1 style="font-size:1.75rem;font-weight:800;margin-bottom:0.25rem">Dashboard</h1>
        <p style="color:var(--text-muted);font-size:0.87rem">Welcome back! Here's your overview.</p>
      </div>
      <button class="btn-primary" id="new-project-btn">+ New Project</button>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="stats-area">
      <div class="stat-card purple"><div class="spinner" style="margin:0;width:24px;height:24px;border-width:2px"></div></div>
    </div>

    <!-- Completion Progress -->
    <div class="card" style="padding:1.25rem;margin-bottom:2rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
        <span style="font-size:0.87rem;font-weight:500">Overall Completion</span>
        <span style="font-size:0.87rem;color:var(--accent);font-weight:600" id="completion-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 280px;gap:1.5rem;align-items:start">
      <div>
        <!-- Projects -->
        <div class="section-header">
          <div class="section-title">Your Projects</div>
        </div>
        <div class="projects-grid" id="projects-grid">
          <div class="page-loader" style="grid-column:1/-1"><div class="spinner"></div></div>
        </div>

        <!-- Overdue -->
        <div style="margin-top:2rem">
          <div class="section-header">
            <div class="section-title">🔥 Overdue Tasks</div>
          </div>
          <div id="overdue-list"><div class="page-loader"><div class="spinner"></div></div></div>
        </div>
      </div>

      <!-- Tasks by user -->
      <div class="card" style="padding:1.25rem;position:sticky;top:80px">
        <div class="section-title" style="margin-bottom:1rem">👥 Tasks by Member</div>
        <div id="user-task-list"><div class="spinner" style="margin:1rem auto;width:24px;height:24px;border-width:2px"></div></div>
      </div>
    </div>
  </div>

  <!-- New Project Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Create New Project</div>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <form id="project-form">
        <div class="form-group">
          <label class="form-label" for="proj-title">Project Title *</label>
          <input type="text" id="proj-title" placeholder="e.g. Website Redesign" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="proj-desc">Description</label>
          <textarea id="proj-desc" rows="3" placeholder="What is this project about?"></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1rem">
          <button type="button" class="btn-ghost" id="modal-cancel" onclick="document.getElementById('modal-overlay').classList.remove('active')">Cancel</button>
          <button type="submit" class="btn-primary">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
