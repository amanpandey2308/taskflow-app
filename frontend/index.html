<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Sign In</title>
  <meta name="description" content="Team Task Management App — Login or create your account"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">⚡ TaskFlow</div>
      <div class="auth-subtitle">Collaborative task management for modern teams</div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login">Sign In</div>
        <div class="auth-tab" id="tab-signup">Sign Up</div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn-primary btn-full" style="margin-top:0.5rem">Sign In</button>
        <div class="auth-divider">or</div>
        <p style="text-align:center;font-size:0.84rem;color:var(--text-muted)">
          Don't have an account? <a href="#" id="go-signup">Create one</a>
        </p>
        <div style="margin-top:1.5rem;padding:1rem;background:rgba(139,92,246,0.07);border:1px solid rgba(139,92,246,0.15);border-radius:8px;font-size:0.8rem;color:var(--text-muted)">
          <strong style="color:var(--text-secondary)">Demo accounts (password: password123)</strong><br/>
          Admin: alice@demo.com &nbsp;|&nbsp; Member: bob@demo.com
        </div>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" style="display:none">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Alice Johnson" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Min 6 characters" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password2">Confirm Password</label>
          <input type="password" id="signup-password2" placeholder="Repeat password" required/>
        </div>
        <button type="submit" class="btn-primary btn-full" style="margin-top:0.5rem">Create Account</button>
        <div class="auth-divider">or</div>
        <p style="text-align:center;font-size:0.84rem;color:var(--text-muted)">
          Already have an account? <a href="#" id="go-login">Sign in</a>
        </p>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
